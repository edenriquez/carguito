[project]
name = "carguito-backend"
version = "0.2.0"
description = "Carguito backend: hexagonal Flask API with a local OCR/parse pipeline and DuckDB analytics cube"
authors = [{ name = "Carguito Team" }]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pyjwt>=2.8",
    "duckdb>=0.10",
    "pdfplumber>=0.11",
    # Application-level crypto for the device ingest path (docs/custody-plan.md
    # F1/G3): the phone seals the extracted text to the server's X25519 key, so
    # a terminated-TLS middlebox sees an opaque body.
    "pynacl>=1.5",
    # Runtime dependency, not dev-only: Container.bootstrap() runs
    # `alembic.command.upgrade` programmatically on startup.
    "alembic>=1.13",
]

[project.optional-dependencies]
# Heavy OCR engines are optional; the pipeline falls back gracefully without them.
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17", "pillow>=10.0"]
# Reading ticket *photos* uploaded from the web (PaddleOCR models on
# onnxruntime, CPU). Without it POST /api/receipts/upload answers 503; the
# phone app never needs it.
receipts = ["rapidocr-onnxruntime>=1.3", "pillow>=10.0"]
# pypdf only encrypts the password-protected PDF fixture in tests.
dev = ["pytest>=8.0", "ruff>=0.4", "pypdf>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
